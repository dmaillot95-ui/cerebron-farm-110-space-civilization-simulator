name: CEREBRON Space Bus consume canary
on:
  push:
    paths: ["bus/inbox/**", "worker/consume_bus.py", ".github/workflows/consume-bus.yml"]
  workflow_dispatch:
jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python worker/consume_bus.py
      - uses: actions/upload-artifact@v4
        with: {name: f110-consumed-state, path: artifacts/consumed.json}
